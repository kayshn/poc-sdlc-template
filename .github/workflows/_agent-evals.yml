# Invariant — part of the AI-native SDLC standard. Pulled by tag; do not edit in a consumer repo.
# The triggers live in the caller, .github/workflows/agent-evals.yml.
#
# Stage 4: the configuration that steers the agent (CLAUDE.md, skills, hooks) is regression-tested
# like code. No nightly schedule: runs count against the Claude subscription's limits.
# Make the "evals / suite" check required in branch protection to gate agent-configuration changes.
name: Agent evals (reusable)

on:
  workflow_call:
    inputs:
      min_pass_rate:
        description: Fraction of eval cases that must pass.
        type: string
        default: "0.66"
      runner:
        description: Runner label for the eval job.
        type: string
        default: ubuntu-latest

jobs:
  suite:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A required status check has to report on every pull request. A `paths:` filter on the
      # trigger would skip the run entirely on unrelated PRs, and a skipped run reports no status,
      # leaving the check pending forever. So the filter lives here, inside a job that always runs.
      - name: Does this change touch the agent's configuration?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "Not a pull request; running the full suite."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" |
             grep -qE '^(CLAUDE\.md|\.sdlc/REVIEW\.md|\.claude/|\.sdlc/evals/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No change to CLAUDE.md, .sdlc/REVIEW.md, .claude/ or .sdlc/evals/, so the eval suite did not run." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Eval cases run `make lint` and `make test`; `make install` provisions the toolchain.
      - if: steps.scope.outputs.relevant == 'true'
        run: make install
      - if: steps.scope.outputs.relevant == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Run eval suite
        if: steps.scope.outputs.relevant == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MIN_PASS_RATE: ${{ inputs.min_pass_rate }}
        run: |
          git config --global user.name evals
          git config --global user.email evals@users.noreply.github.com
          ./.sdlc/evals/run_evals.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.relevant == 'true'
        with:
          name: eval-results
          path: eval-results/
