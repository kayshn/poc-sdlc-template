name: CI

on:
  # paths-ignore is on `push` only: a skipped run reports no status, which would
  # leave the required `test` check pending forever on artefact-only PRs.
  push:
    branches: [main]
    paths-ignore: ["**.md", ".sdlc/docs/**", ".sdlc/intent/**", ".sdlc/specs/**", ".sdlc/plans/**", ".sdlc/lessons/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # TEMPLATE: add this project's toolchain here, e.g.
      #   - uses: actions/setup-node@v5
      #     with: { node-version: "24", cache: npm }
      #   - uses: actions/setup-java@v5
      #     with: { distribution: temurin, java-version: "21", cache: maven }
      - run: make install

      - name: Check the SDLC flow declaration
        run: make flow-check
      - name: Lint
        shell: bash
        run: make lint 2>&1 | tee -a ci.log
      - name: Test
        shell: bash
        run: make test 2>&1 | tee -a ci.log

      # Stage 5 play: Claude as a read-only judgment step in the pipeline.
      - name: Triage failed build
        if: failure() && github.event_name == 'pull_request'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "No Claude token (fork PR?); skipping triage"; exit 0; }
          npm install -g @anthropic-ai/claude-code
          claude -p "Read the CI log at ci.log and the files it points to. Identify the most likely
          cause, say whether the failure looks flaky or real, and write a summary of at most five
          lines for the PR thread. Output only the summary." \
            --allowedTools "Read,Grep,Glob" > triage.md
          { echo "### CI triage (Claude)"; cat triage.md; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
